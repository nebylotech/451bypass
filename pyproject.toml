[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "51-bypass"
version = "1.0.0"
description = "Zero-Cost Regional Restriction Bypass (HTTP 451/403) and AI Gateway for NVIDIA, OpenAI, xAI and custom endpoints."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "51-BYPASS Team" }
]
keywords = ["nvidia", "http-451", "bypass", "cloudflare-worker", "ai-gateway", "openai", "grok"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
51b = "bypass51.cli:main"

[tool.setuptools.packages.find]
include = ["bypass51*"]
